<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SOP Skill Check · Felix Plaza</title>
  <meta name="description" content="Felix Plaza SOP Skill Check: a short multiple choice test on our Standard Operating Procedures.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/felix-insignia-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/felix-insignia-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="assets/felix-wordmark.png" alt="Felix Plaza" class="brand-logo" width="53" height="40">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-name" id="app-name">SOP Skill Check</span>
      </div>
      <div class="topbar-right">
        <div class="timer" id="timer" hidden role="timer" aria-live="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span id="timer-text">00:00</span>
        </div>
        <div class="seg" role="group" aria-label="Language" id="lang-seg">
          <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="hi" lang="hi" aria-pressed="false">हिंदी</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="page" id="app">
      <noscript><p>Please turn on JavaScript to take the test.</p></noscript>
    </div>
  </main>

  <footer class="footer">Felix Plaza · Engineering &amp; Facilities</footer>

  <script src="js/config.js?v=5"></script>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/questions-gas-generator.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
